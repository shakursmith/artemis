openapi: 3.0.0
info:
  title: Artemis Business Photos API
  version: 1.0.0
  description: |
    API contract for the business photos aggregation endpoint. This endpoint
    flattens photo URLs from customer reviews into a single paginated list,
    enriched with review attribution context (customer name, rating, date).

    ## Purpose

    The home tab shows a horizontal photo carousel of recent customer photos.
    Rather than fetching all reviews and extracting photos client-side, this
    endpoint does the aggregation server-side and returns a flat list of
    individual photos with metadata.

    ## Data Source

    Photos are sourced from the `photo_urls` JSON array field on the `reviews`
    table. Each review can have multiple photos; this endpoint flattens them
    into individual entries sorted by review creation date (newest first).

    ## Customer Name Attribution

    Each photo entry includes the customer's first name (from the `customers`
    table via LEFT JOIN). If the review's `customer_id` doesn't match a
    customer row (e.g., stub IDs from before auth was implemented), the name
    falls back to "Customer".

servers:
  - url: /api
    description: Default API base path (configurable via API_BASE_PATH env var)

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
      required:
        - error

    BusinessPhoto:
      type: object
      description: |
        A single photo extracted from a review, with attribution context.
        Multiple photos from the same review will each appear as separate
        entries sharing the same reviewId, customerName, rating, and createdAt.
      properties:
        url:
          type: string
          format: uri
          description: URL of the photo
          example: "https://cdn.example.com/images/review-abc123.jpg"
        reviewId:
          type: string
          format: uuid
          description: ID of the review this photo belongs to
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        customerName:
          type: string
          description: Display name of the customer who posted the review (first name or "Customer" fallback)
          example: "Alex"
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Star rating from the review
          example: 5
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the review creation
          example: "2026-11-15T14:30:00Z"
      required:
        - url
        - reviewId
        - customerName
        - rating
        - createdAt

    BusinessPhotosResponse:
      type: object
      description: Paginated list of business photos aggregated from reviews
      properties:
        data:
          type: array
          description: Array of photo entries
          items:
            $ref: '#/components/schemas/BusinessPhoto'
        pagination:
          type: object
          description: Pagination metadata
          properties:
            offset:
              type: integer
              description: Number of items skipped
              example: 0
            limit:
              type: integer
              description: Maximum number of items per page
              example: 20
            total:
              type: integer
              description: Total number of photos across all reviews for this business
              example: 47
          required:
            - offset
            - limit
            - total
      required:
        - data
        - pagination

paths:
  /business/{businessId}/photos:
    get:
      summary: List aggregated review photos for a business
      description: |
        Returns a paginated, flattened list of photos from all reviews for a
        business. Photos are sorted newest-first by the review's creation date.

        Reviews with empty or null `photo_urls` are excluded. Each photo URL
        from a review's array becomes its own entry in the response, enriched
        with the review's metadata (customer name, rating, timestamp).

        **Use cases:**
        - Home tab photo carousel (limit=10 for initial load)
        - Full-screen "See all photos" gallery (paginated)

        **Performance note:** For MVP, the endpoint fetches all matching reviews
        and flattens in memory. If this becomes slow at scale, consider
        denormalizing into a `review_photos` table.
      tags:
        - Photos
      parameters:
        - name: businessId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Business ID
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Maximum number of photos to return per page
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of photos to skip
      responses:
        '200':
          description: Paginated list of photos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessPhotosResponse'
              examples:
                with-photos:
                  summary: Business with customer photos
                  value:
                    data:
                      - url: "https://cdn.example.com/images/review-abc123.jpg"
                        reviewId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                        customerName: "Alex"
                        rating: 5
                        createdAt: "2026-11-15T14:30:00Z"
                      - url: "https://cdn.example.com/images/review-def456.jpg"
                        reviewId: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                        customerName: "Customer"
                        rating: 4
                        createdAt: "2026-11-14T10:00:00Z"
                    pagination:
                      offset: 0
                      limit: 20
                      total: 47
                empty:
                  summary: Business with no customer photos
                  value:
                    data: []
                    pagination:
                      offset: 0
                      limit: 20
                      total: 0
        '400':
          description: Invalid query parameters (limit out of range, bad offset)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "limit must be between 1 and 100"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
