  # =============================================================================
  # Bulk Import (Admin)
  # =============================================================================

  /business/{businessId}/product-menus/bulk-import:
    post:
      summary: Bulk import a complete menu
      description: |
        Imports a complete menu with categories, items, and modifiers in one call.
        Supports dry-run mode for validation without saving. Returns validation
        errors per row if any data is invalid.

        **Note:** This endpoint only handles structured JSON input. It does NOT
        parse PDFs, photos, or other file formats. The shape is defined for
        programmatic import from spreadsheets or other data sources.
      tags:
        - Admin
      parameters:
        - name: businessId
          in: path
          required: true
